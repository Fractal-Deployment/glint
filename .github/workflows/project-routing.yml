              }
              await addLabel('routing-moved');
            } catch (e) {
              await addLabel('routing-move-failed');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: marker + '\nProject: n/a — org-keeper project-routing (move log; no board)\n\nMOVE was requested (' + fromName + ' → ' + toName + ') but the field-value read or un-link step failed. The item was already added to ' + toUrl + ' and was left on the old board. Boards outside the routing table were left untouched. Error (no secrets): ' + String(e && e.message ? e.message : e) + '\n'
              });
