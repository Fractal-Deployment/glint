<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLINT Trace Viewer</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--mute:#667085;--line:#dde1e7;--acc:#2f6fed;--pos:#d9480f;--neg:#1971c2;--good:#2b8a3e;--bad:#c92a2a;--sel:#e8f0ff}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--panel:#181b20;--ink:#e6e8eb;--mute:#8b94a3;--line:#2a2f37;--acc:#6ea0ff;--pos:#ff8a4c;--neg:#5aa9ff;--good:#51cf66;--bad:#ff6b6b;--sel:#1f2a44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0 0 2px}
header .sub{color:var(--mute);font-size:12px}
.tok{display:inline-block;padding:1px 6px;margin:2px 3px 0 0;border:1px solid var(--line);border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tok.last{border-color:var(--acc);background:var(--sel)}
#wrap{flex:1;display:flex;min-height:0}
#side{width:270px;overflow:auto;border-right:1px solid var(--line);background:var(--panel);flex:none}
#side .lh{position:sticky;top:0;background:var(--panel);padding:6px 10px;font-weight:600;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);cursor:pointer}
.it{padding:4px 10px 4px 14px;cursor:pointer;border-left:3px solid transparent;font-size:13px;display:flex;gap:8px}
.it:hover{background:var(--sel)}
.it.on{background:var(--sel);border-left-color:var(--acc)}
.it .k{flex:none;width:58px;color:var(--mute);font-size:11px;padding-top:1px}
#main{flex:1;overflow:auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 6px}
.card h3{font-size:13px;margin:12px 0 4px;color:var(--mute);font-weight:600}
.eq{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0}
.mute{color:var(--mute)}
canvas{width:100%;display:block;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px}
th,td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
tr.cur td{background:var(--sel);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}
.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
footer{border-top:1px solid var(--line);background:var(--panel);padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=range]{accent-color:var(--acc)}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}.two>div{min-width:0;overflow-x:auto}
@media (max-width:1100px){.two{grid-template-columns:1fr}}@media (max-width:700px){#side{display:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.kv span:nth-child(odd){color:var(--mute)}
#tip{position:fixed;pointer-events:none;background:#000c;color:#fff;font:12px ui-monospace,Menlo,monospace;padding:3px 6px;border-radius:4px;display:none;z-index:9}
</style>
</head>
<body>
<header>
  <h1>GLINT trace viewer — SmolLM2-135M on a glint_pin_v1 pin</h1>
  <div class="sub" id="sub"></div>
  <div id="toks"></div>
</header>
<div id="wrap"><div id="side"></div><div id="main"></div></div>
<footer>
  <button class="btn" id="prev">◀ prev op</button>
  <button class="btn" id="next">next op ▶</button>
  <button class="btn" id="play">▶ play ops</button>
  <label class="mute">speed <input type="range" id="spd" min="1" max="20" value="6"></label>
  <span id="pos" class="mute"></span>
  <span class="mute">keys: ← → step ops</span>
</footer>
<div id="tip"></div>
<script type="application/json" id="trace">/*TRACE_JSON*/</script>
<script type="application/json" id="vocab">/*VOCAB_JSON*/</script>
<script>
"use strict";
const TR = JSON.parse(document.getElementById('trace').textContent);
const VOC = JSON.parse(document.getElementById('vocab').textContent);
const f = Math.fround;
const dec = a => new Float32Array(new Uint32Array(a).buffer);
const u2f = b => dec([b])[0];
const CELLS = dec(TR.cells);
const T = {}; for (const k in TR.tensors) T[k] = dec(TR.tensors[k]);
const OPS = TR.ops;
const tokStr = id => (VOC[id] !== undefined ? VOC[id] : '#' + id);
const fmt = (x, d = 6) => (x === 0 ? '0' : (Math.abs(x) >= 1e4 || Math.abs(x) < 1e-3 ? x.toExponential(d - 2) : x.toPrecision(d)));
const $ = (t, a, c) => { const e = document.createElement(t); if (a) Object.assign(e, a); if (c) c.forEach(x => e.append(x)); return e; };
const tip = document.getElementById('tip');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- header ----------
document.getElementById('sub').textContent = `${TR.meta.model} · ${TR.meta.layers} layers · hidden ${TR.meta.hidden} · ${TR.meta.heads} heads / ${TR.meta.kv_heads} kv heads · arithmetic: ${TR.meta.arithmetic}`;
TR.tokens.forEach((id, i) => document.getElementById('toks').append($('span', { className: 'tok' + (i === TR.trace_pos ? ' last' : ''), textContent: tokStr(id) + ' · ' + id, title: i === TR.trace_pos ? 'traced token (position ' + i + ')' : 'position ' + i })));

// ---------- charts ----------
function vecChart(parent, data, o = {}) {
  const h = o.height || 96, dpr = window.devicePixelRatio || 1;
  const cv = $('canvas'); cv.style.height = h + 'px'; parent.append(cv);
  const W = Math.max(200, parent.clientWidth - 30); cv.width = W * dpr; cv.height = h * dpr; cv.style.width = W + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const n = data.length; let mx = 0; for (let i = 0; i < n; i++) { const a = Math.abs(data[i]); if (a > mx) mx = a; } if (mx === 0) mx = 1;
  const base = o.pos ? h - 4 : h / 2, scale = (o.pos ? h - 10 : h / 2 - 4) / mx;
  g.strokeStyle = css('--line'); g.beginPath(); g.moveTo(0, base); g.lineTo(W, base); g.stroke();
  for (let x = 0; x < W; x++) {
    const i0 = Math.floor(x * n / W), i1 = Math.max(i0 + 1, Math.floor((x + 1) * n / W)); let b = data[i0];
    for (let i = i0; i < Math.min(n, i1); i++) if (Math.abs(data[i]) > Math.abs(b)) b = data[i];
    g.fillStyle = b >= 0 ? css('--pos') : css('--neg'); const l = b * scale; g.fillRect(x, l >= 0 ? base - l : base, 1, Math.max(1, Math.abs(l)));
  }
  (o.marks || []).forEach(m => { g.fillStyle = css('--acc'); const x = (m + 0.5) * W / n; g.fillRect(Math.floor(x), 0, 2, h); });
  g.fillStyle = css('--mute'); g.font = '11px ui-monospace,Menlo,monospace';
  g.fillText((o.title || '') + (o.title ? '  ' : '') + 'n=' + n + '  max|v|=' + fmt(mx, 4), 6, 12);
  cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); const i = Math.min(n - 1, Math.floor((e.clientX - r.left) / r.width * n)); tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; tip.textContent = (o.names ? o.names(i) : '[' + i + ']') + ' = ' + fmt(data[i], 8); if (o.onclick) cv.style.cursor = 'pointer'; });
  cv.addEventListener('mouseleave', () => tip.style.display = 'none');
  if (o.onclick) cv.addEventListener('click', e => { const r = cv.getBoundingClientRect(); o.onclick(Math.min(n - 1, Math.floor((e.clientX - r.left) / r.width * n))); });
  return cv;
}
function table(head, rows, cur) {
  const t = $('table'); const th = $('tr'); head.forEach(x => th.append($('th', { textContent: x }))); t.append(th);
  rows.forEach((r, i) => { const tr = $('tr'); if (i === cur) tr.className = 'cur'; r.forEach(c => tr.append($('td', { textContent: c }))); t.append(tr); });
  return t;
}
const card = (title, desc) => { const c = $('div', { className: 'card' }); if (title) c.append($('h2', { textContent: title })); if (desc) c.append($('div', { className: 'mute', innerHTML: desc })); return c; };
const eq = s => $('div', { className: 'eq', textContent: s });

// ---------- renderers ----------
function rEmbed(op, M) {
  const c = card('Token embedding — GLINT decode', `Token <b>${tokStr(op.token)}</b> (id ${op.token}) selects row ${op.token} of the embedding matrix. Nothing is multiplied: each of the ${TR.meta.hidden} values is decoded from two 4-bit codes and a block scale.`);
  c.append(eq('w[k] = cells[h][p] × absmax[⌊(row·K + k) / 64⌋]      h = hole nibble, p = plug nibble'));
  const p = op.probe, s = dec(p.s), y = T[op.y]; let ok = 0; const rows = [];
  for (let k = 0; k < p.h.length; k++) { const w = f(CELLS[p.h[k] * 16 + p.p[k]] * s[k >> 6]); if (w === y[k]) ok++; if (k < 24) rows.push([k, p.h[k], p.p[k], fmt(CELLS[p.h[k] * 16 + p.p[k]], 8), fmt(s[k >> 6], 8), fmt(w, 8)]); }
  c.append($('div', { innerHTML: `Recomputed ${ok}/${p.h.length} embedding values from nibbles: <span class="${ok === p.h.length ? 'ok' : 'no'}">${ok === p.h.length ? 'all bit-exact' : 'mismatch'}</span>` }));
  c.append($('h3', { textContent: 'first 24 elements' })); c.append(table(['k', 'h', 'p', 'cell[h][p]', 'absmax', 'w = cell × absmax'], rows));
  M.append(c); const c2 = card('Embedding vector (input to layer 0)'); M.append(c2); vecChart(c2, y, { title: 'x₀' });
}
function rNorm(op, M) {
  const x = T[op.x], w = T[op.w], y = T[op.y], ss = u2f(op.sumsq), mean = u2f(op.mean), rs = u2f(op.rsqrt);
  const c = card('RMSNorm — ' + op.name, 'Root-mean-square normalisation: scale the vector so its mean square is 1, then multiply by a learned per-channel weight.');
  c.append(eq('sumsq = Σ x[i]²          mean = sumsq / ' + x.length + '          rsqrt = 1 / √(mean + ε)          y[i] = weight[i] × (x[i] × rsqrt)'));
  c.append($('div', { className: 'kv' }, [$('span', { textContent: 'sumsq' }), $('span', { textContent: fmt(ss, 9) }), $('span', { textContent: 'mean' }), $('span', { textContent: fmt(mean, 9) }), $('span', { textContent: 'ε' }), $('span', { textContent: fmt(u2f(op.eps), 4) }), $('span', { textContent: 'rsqrt' }), $('span', { textContent: fmt(rs, 9) })]));
  let ssc = f(0); for (let i = 0; i < x.length; i++) ssc = f(ssc + f(x[i] * x[i]));
  c.append($('div', { innerHTML: `Recomputed sumsq from the input in f32: <span class="${ssc === ss ? 'ok' : 'no'}">${ssc === ss ? 'bit-exact' : 'differs (' + ssc + ')'}</span>` }));
  M.append(c);
  const c2 = card('Vectors'); M.append(c2);
  vecChart(c2, x, { title: 'input x' }); c2.append($('div', { style: 'height:6px' })); vecChart(c2, w, { title: 'weight' }); c2.append($('div', { style: 'height:6px' })); vecChart(c2, y, { title: 'output y' });
  const rows = []; for (let i = 0; i < 16; i++) { const n = f(x[i] * rs); rows.push([i, fmt(x[i], 8), fmt(n, 8), fmt(w[i], 8), fmt(f(w[i] * n), 8), fmt(y[i], 8)]); }
  c2.append($('h3', { textContent: 'first 16 elements' })); c2.append(table(['i', 'x[i]', 'x·rsqrt', 'weight', 'weight·(x·rsqrt)', 'traced y[i]'], rows));
}
let accTimer = null;
function rMatmul(op, M) {
  if (accTimer) { clearInterval(accTimer); accTimer = null; }
  const x = T[op.x], y = T[op.y], N = op.N, K = op.K;
  const c = card((op.layer >= 0 ? 'Layer ' + op.layer + ' · ' : '') + op.name + ' — matrix × vector', `Weight tensor <code>${op.weight}</code> is ${N} × ${K}, stored as GLINT (two 4-bit codes per weight). The viewer rebuilds each probed output element from the stored nibbles and compares it with the traced result.`);
  c.append(eq('y[r] = Σₖ w[r,k] · x[k]      w[r,k] = cells[h][p] × absmax[⌊(r·K + k) / 64⌋]      f32, k = 0 … K−1, product rounded, then added'));
  M.append(c);
  const cc = card('Input and output'); M.append(cc);
  vecChart(cc, x, { title: 'input x (' + op.x + ')' }); cc.append($('div', { style: 'height:6px' }));
  const marks = op.probes.map(p => p.row);
  vecChart(cc, y, { title: 'output y (' + op.y + ')  — blue lines = probed rows, click one', marks, names: i => 'row ' + i, onclick: r => { let best = 0, bd = 1e9; op.probes.forEach((p, j) => { const d = Math.abs(p.row - r); if (d < bd) { bd = d; best = j; } }); sel(best); } });
  const pc = card('Watch one output element being computed'); M.append(pc);
  const tabs = $('div', { className: 'row' }); pc.append(tabs); const body = $('div'); pc.append(body);
  let curProbe = 0;
  function sel(j) {
    curProbe = j; if (accTimer) { clearInterval(accTimer); accTimer = null; }
    [...tabs.children].forEach((b, i) => b.classList.toggle('on', i === j)); body.innerHTML = ''; showProbe(op.probes[j]);
  }
  op.probes.forEach((p, j) => tabs.append($('button', { className: 'btn', textContent: 'row ' + p.row, onclick: () => sel(j) })));
  function showProbe(p) {
    const s = dec(p.s), W = new Float32Array(K), P = new Float32Array(K), A = new Float32Array(K); let acc = f(0);
    for (let k = 0; k < K; k++) { W[k] = f(CELLS[p.h[k] * 16 + p.p[k]] * s[k >> 6]); P[k] = f(W[k] * x[k]); acc = f(acc + P[k]); A[k] = acc; }
    const exact = acc === y[p.row];
    body.append($('div', { innerHTML: `Recomputed y[${p.row}] = <b>${fmt(acc, 9)}</b> from ${K} nibble pairs · traced y[${p.row}] = <b>${fmt(y[p.row], 9)}</b> · <span class="${exact ? 'ok' : 'no'}">${exact ? 'bit-exact ✓' : 'differs by ' + fmt(Math.abs(acc - y[p.row]), 3)}</span>` }));
    const ctl = $('div', { className: 'row' }); body.append(ctl);
    let k = 0; const slider = $('input', { type: 'range', min: 0, max: K - 1, value: 0, style: 'flex:1;min-width:200px' });
    const lab = $('span', { className: 'mute' });
    const btn = (t, d) => $('button', { className: 'btn', textContent: t, onclick: () => { slider.value = Math.max(0, Math.min(K - 1, +slider.value + d)); draw(); } });
    const play = $('button', { className: 'btn', textContent: '▶ accumulate', onclick: () => { if (accTimer) { clearInterval(accTimer); accTimer = null; play.textContent = '▶ accumulate'; return; } if (+slider.value >= K - 1) slider.value = 0; play.textContent = '❚❚ pause'; accTimer = setInterval(() => { const st = Math.max(1, Math.round(K / 160)); slider.value = Math.min(K - 1, +slider.value + st); draw(); if (+slider.value >= K - 1) { clearInterval(accTimer); accTimer = null; play.textContent = '▶ accumulate'; } }, 40); } });
    ctl.append(btn('−16', -16), btn('−1', -1), slider, btn('+1', 1), btn('+16', 16), play, lab);
    const two = $('div', { className: 'two' }); body.append(two); const left = $('div'), right = $('div'); two.append(left, right);
    const gridCv = $('canvas'); gridCv.style.cssText = 'width:280px;height:280px;image-rendering:pixelated'; gridCv.width = 280; gridCv.height = 280; right.append($('h3', { textContent: 'the 16×16 cell table: row = hole nibble h, column = plug nibble p' })); right.append(gridCv);
    const cellInfo = $('div', { className: 'eq' }); right.append(cellInfo);
    const tblHost = $('div'); left.append(tblHost); const chartHost = $('div'); body.append(chartHost);
    function draw() {
      k = +slider.value; lab.textContent = 'k = ' + k + ' / ' + (K - 1);
      const rows = []; const lo = Math.max(0, k - 6), hi = Math.min(K - 1, k + 6);
      for (let i = lo; i <= hi; i++) rows.push([i, p.h[i], p.p[i], fmt(CELLS[p.h[i] * 16 + p.p[i]], 7), fmt(s[i >> 6], 7), fmt(W[i], 7), fmt(x[i], 7), fmt(P[i], 7), fmt(A[i], 8)]);
      tblHost.innerHTML = ''; tblHost.append(table(['k', 'h', 'p', 'cell', 'absmax', 'w', 'x[k]', 'w·x', 'running sum'], rows, k - lo));
      const g = gridCv.getContext('2d'); let mn = 1e9, mxv = -1e9; for (let i = 0; i < 256; i++) { mn = Math.min(mn, CELLS[i]); mxv = Math.max(mxv, CELLS[i]); }
      for (let h = 0; h < 16; h++) for (let q = 0; q < 16; q++) { const v = (CELLS[h * 16 + q] - mn) / (mxv - mn); g.fillStyle = `hsl(${220 - 220 * v},70%,${35 + 30 * v}%)`; g.fillRect(q * 17.5, h * 17.5, 17.5, 17.5); }
      g.strokeStyle = '#fff'; g.lineWidth = 3; g.strokeRect(p.p[k] * 17.5 + 1, p.h[k] * 17.5 + 1, 15.5, 15.5); g.strokeStyle = '#000'; g.lineWidth = 1; g.strokeRect(p.p[k] * 17.5 + 1, p.h[k] * 17.5 + 1, 15.5, 15.5);
      cellInfo.textContent = `k=${k}: hole h=${p.h[k]}, plug p=${p.p[k]} → cell = ${fmt(CELLS[p.h[k] * 16 + p.p[k]], 8)}; block ${k >> 6} absmax = ${fmt(s[k >> 6], 8)}; w = ${fmt(W[k], 8)}; x = ${fmt(x[k], 8)}; w·x = ${fmt(P[k], 8)}; Σ = ${fmt(A[k], 9)}`;
      chartHost.innerHTML = ''; const part = new Float32Array(K); for (let i = 0; i <= k; i++) part[i] = A[i];
      vecChart(chartHost, P, { title: 'products w·x (all k)', marks: [k], height: 70 }); chartHost.append($('div', { style: 'height:6px' }));
      vecChart(chartHost, part, { title: 'running sum up to k → final ' + fmt(acc, 8), marks: [k], height: 90 });
    }
    slider.addEventListener('input', draw); draw();
  }
  sel(0);
}
function rRope(op, M) {
  const c = card('Layer ' + op.layer + ' · rotary position embedding', `Position ${op.position}. Each head's vector is split into pairs (i, i+${op.head_dim / 2}) and each pair is rotated by an angle that depends on the position and the pair index.`);
  c.append(eq('angle_i = position × θ^(−2i/' + op.head_dim + ')   θ = ' + fmt(u2f(op.theta), 8) + '      a′ = a·cos − b·sin      b′ = b·cos + a·sin'));
  const q = T[op.q], qo = T[op.q_out], k = T[op.k], ko = T[op.k_out], cs = T[op.cos], sn = T[op.sin];
  const row = $('div', { className: 'row' }); c.append(row); let which = 'q', head = 0;
  const host = $('div'); c.append(host);
  function draw() {
    host.innerHTML = ''; const src = which === 'q' ? q : k, dst = which === 'q' ? qo : ko, D = op.head_dim, o = head * D;
    const rows = []; for (let i = 0; i < 12; i++) { const a = src[o + i], b = src[o + i + D / 2]; rows.push([i, fmt(cs[i], 7), fmt(sn[i], 7), fmt(a, 7), fmt(b, 7), fmt(f(f(a * cs[i]) - f(b * sn[i])), 7), fmt(dst[o + i], 7), fmt(f(f(b * cs[i]) + f(a * sn[i])), 7), fmt(dst[o + i + D / 2], 7)]); }
    host.append(table(['i', 'cos', 'sin', 'a', 'b', 'a·cos−b·sin', 'traced a′', 'b·cos+a·sin', 'traced b′'], rows));
    host.append($('div', { style: 'height:6px' })); vecChart(host, src.subarray(o, o + D), { title: which + ' head ' + head + ' before' }); host.append($('div', { style: 'height:6px' })); vecChart(host, dst.subarray(o, o + D), { title: which + ' head ' + head + ' after' });
  }
  ['q', 'k'].forEach(w => row.append($('button', { className: 'btn' + (w === 'q' ? ' on' : ''), textContent: w, onclick: e => { which = w; head = Math.min(head, (w === 'q' ? op.heads_q : op.heads_kv) - 1); [...row.children].forEach(b => b.classList.toggle('on', b.textContent === w)); draw(); } })));
  row.append($('span', { className: 'mute', textContent: 'head' })); const hs = $('input', { type: 'range', min: 0, max: op.heads_q - 1, value: 0 }); const hl = $('span', { textContent: '0' }); hs.addEventListener('input', () => { head = Math.min(+hs.value, (which === 'q' ? op.heads_q : op.heads_kv) - 1); hl.textContent = head; draw(); }); row.append(hs, hl);
  M.append(c); draw();
}
function rAttn(op, M) {
  const c = card('Layer ' + op.layer + ' · attention', `The new token's query is compared with every cached key (${op.T} positions). Scores become probabilities with a softmax, and the output is the probability-weighted sum of the cached values. Query head h reads key/value head ⌊h/${op.heads / op.kv_heads}⌋ (grouped-query attention).`);
  c.append(eq('score[t] = (q · k[t]) × ' + op.scale + '     p = softmax(score)     out = Σₜ p[t] · v[t]'));
  const sc = T[op.scores], pr = T[op.probs], out = T[op.y], q = T[op.q], kc = T[op.kc], vc = T[op.vc], Tn = op.T, D = op.head_dim;
  const row = $('div', { className: 'row' }); c.append(row); const host = $('div'); c.append(host); let head = 0;
  function draw() {
    host.innerHTML = ''; const kvh = Math.floor(head / (op.heads / op.kv_heads)); const rows = [];
    for (let t = 0; t < Tn; t++) { let d = f(0); for (let i = 0; i < D; i++) d = f(d + f(q[head * D + i] * kc[t * 192 + kvh * D + i])); rows.push([t + (t === Tn - 1 ? ' (this token)' : ''), tokStr(TR.tokens[t]), fmt(d, 7), fmt(sc[head * Tn + t], 7), fmt(pr[head * Tn + t], 6)]); }
    host.append(table(['position', 'token', 'q·k (recomputed)', 'score ×0.125 (traced)', 'probability'], rows));
    host.append($('div', { style: 'height:6px' })); vecChart(host, pr.subarray(head * Tn, head * Tn + Tn), { title: 'attention probabilities, head ' + head, pos: true, height: 70, names: i => 'position ' + i + ' ' + tokStr(TR.tokens[i]) });
    host.append($('div', { style: 'height:6px' })); vecChart(host, out.subarray(head * D, head * D + D), { title: 'head ' + head + ' output (Σ p·v)' });
  }
  row.append($('span', { className: 'mute', textContent: 'query head' })); const hs = $('input', { type: 'range', min: 0, max: op.heads - 1, value: 0 }); const hl = $('span', { textContent: '0' }); hs.addEventListener('input', () => { head = +hs.value; hl.textContent = head; draw(); }); row.append(hs, hl);
  M.append(c); draw();
}
function rSilu(op, M) {

  const c = card('Layer ' + op.layer + ' · gated activation', 'SiLU(gate) × up: the gate is squashed by a sigmoid and multiplies itself, and the result scales the up projection.'); c.append(eq('act[i] = (gate[i] × sigmoid(gate[i])) × up[i]      sigmoid(g) = 1 / (1 + e^(−g))'));
  const rows = []; for (let i = 0; i < 14; i++) rows.push([i, fmt(g[i], 7), fmt(s[i], 7), fmt(f(g[i] * s[i]), 7), fmt(u[i], 7), fmt(f(f(g[i] * s[i]) * u[i]), 7), fmt(y[i], 7)]);
  c.append(table(['i', 'gate', 'sigmoid', 'gate·σ', 'up', 'recomputed act', 'traced act'], rows)); M.append(c);
  const c2 = card('Vectors'); M.append(c2); [['gate', g], ['up', u], ['act', y]].forEach(([n, v]) => { vecChart(c2, v, { title: n }); c2.append($('div', { style: 'height:6px' })); });
}
function rRes(op, M) {
  const a = T[op.a], b = T[op.b], y = T[op.y];
  const c = card('Layer ' + op.layer + ' · ' + op.name, 'The sublayer output is added back to its input (the residual stream).'); let ok = 0; for (let i = 0; i < y.length; i++) if (f(a[i] + b[i]) === y[i]) ok++;
  c.append($('div', { innerHTML: `y = a + b recomputed for all ${y.length} elements: <span class="${ok === y.length ? 'ok' : 'no'}">${ok}/${y.length} bit-exact</span>` })); M.append(c);
  const c2 = card('Vectors'); M.append(c2); [['a (stream in)', a], ['b (sublayer output)', b], ['y = a + b', y]].forEach(([n, v]) => { vecChart(c2, v, { title: n }); c2.append($('div', { style: 'height:6px' })); });
}
function rOut(op, M) {
  const lg = T['logits']; let mx = -1e30; for (const v of lg) if (v > mx) mx = v; let z = 0; for (const v of lg) z += Math.exp(v - mx);
  const c = card('Next-token prediction (greedy)', 'Final logits over the vocabulary; softmax turns them into probabilities. The model emits the largest logit.');
  const rows = op.top_ids.map((id, i) => [i + 1, id, JSON.stringify(tokStr(id)), fmt(u2f(op.top_logits[i]), 7), (100 * Math.exp(u2f(op.top_logits[i]) - mx) / z).toFixed(2) + '%']);
  c.append(table(['rank', 'token id', 'token', 'logit', 'probability'], rows)); M.append(c);
  const c2 = card('All 49,152 logits'); M.append(c2); vecChart(c2, lg, { title: 'logits', height: 110, names: i => tokStr(i) + ' (' + i + ')' });
}
const R = { embed: rEmbed, rmsnorm: rNorm, matmul: rMatmul, rope: rRope, attention: rAttn, silu_gate: rSilu, residual: rRes, output: rOut };
const KLAB = { embed: 'decode', rmsnorm: 'norm', matmul: 'matmul', rope: 'rope', attention: 'attn', silu_gate: 'silu', residual: 'add', output: 'output' };

// ---------- sidebar + navigation ----------
const side = document.getElementById('side'), main = document.getElementById('main');
let idx = 0; const items = [];
let lastLayer = -99;
OPS.forEach((op, i) => {
  if (op.layer !== lastLayer) { lastLayer = op.layer; const lh = $('div', { className: 'lh', textContent: op.layer < 0 ? (i === 0 ? 'Embedding' : 'Final norm + logits') : 'Layer ' + op.layer }); lh.dataset.layer = op.layer; side.append(lh); }
  const it = $('div', { className: 'it' }, [$('span', { className: 'k', textContent: KLAB[op.kind] || op.kind }), $('span', { textContent: op.name })]); it.onclick = () => go(i); side.append(it); items.push(it);
});
function go(i) {
  idx = Math.max(0, Math.min(OPS.length - 1, i)); items.forEach((e, j) => e.classList.toggle('on', j === idx)); items[idx].scrollIntoView({ block: 'nearest' });
  main.innerHTML = ''; if (accTimer) { clearInterval(accTimer); accTimer = null; } const op = OPS[idx]; (R[op.kind] || (() => { }))(op, main);
  document.getElementById('pos').textContent = 'op ' + (idx + 1) + ' / ' + OPS.length + (op.layer >= 0 ? ' · layer ' + op.layer : '');
}
document.getElementById('prev').onclick = () => go(idx - 1); document.getElementById('next').onclick = () => go(idx + 1);
let opTimer = null; const playB = document.getElementById('play');
playB.onclick = () => { if (opTimer) { clearInterval(opTimer); opTimer = null; playB.textContent = '▶ play ops'; return; } playB.textContent = '❚❚ pause'; opTimer = setInterval(() => { if (idx >= OPS.length - 1) { clearInterval(opTimer); opTimer = null; playB.textContent = '▶ play ops'; return; } go(idx + 1); }, 2400 - 110 * document.getElementById('spd').value); };
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1); });
window.addEventListener('resize', () => go(idx));
go(0);
</script>
